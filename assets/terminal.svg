<title id="ttl">C. Murali Madhav: terminal introduction</title>
<desc id="dsc">$ whoami / C. Murali Madhav / i build for systems that break expensively. / $ cat highlights.txt / 112x   cuda kernels vs single-core numpy / 2.50%  my grid forecast error. the grid&#x27;s own: 3.51% / #8     hackmit puzzle contest, worldwide. was 17th. / $ cat startup.json / {&quot;name&quot;: null, &quot;c_corp&quot;: &quot;in process&quot;, /  &quot;clients&quot;: [&quot;FL&quot;, &quot;NY&quot;]} / $ git commit -m &quot;name the startup&quot; / nothing to commit, working tree clean</desc>
