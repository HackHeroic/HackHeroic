<text class="s" style="animation-delay:1.26s" x="30" y="120" font-size="36"><tspan fill="#e6edf3" font-weight="700">C. Murali Madhav</tspan></text>
<text class="s" style="animation-delay:1.39s" x="30" y="150" font-size="20"><tspan fill="#8b949e">i build for systems that break expensively.</tspan></text>
<g class="s" style="animation-delay:1.52s"><text x="30" y="180" font-size="20"><tspan fill="#58a6ff">~</tspan><tspan fill="#3fb950"> $ </tspan><tspan fill="#e6edf3">cat highlights.txt</tspan></text><g class="t2"><rect x="78.0" y="162" width="760" height="28" fill="#161b22"/><rect class="c2" x="78.0" y="163" width="12.0" height="23" fill="#e6edf3" opacity="0"/></g></g>
