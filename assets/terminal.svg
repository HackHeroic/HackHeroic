<g class="s" style="animation-delay:5.31s"><text x="30" y="390" font-size="20"><tspan fill="#58a6ff">~</tspan><tspan fill="#3fb950"> $ </tspan><tspan fill="#e6edf3">git commit -m &quot;name the startup&quot;</tspan></text><g class="t4"><rect x="78.0" y="372" width="760" height="28" fill="#161b22"/><rect class="c4" x="78.0" y="373" width="12.0" height="23" fill="#e6edf3" opacity="0"/></g></g>
