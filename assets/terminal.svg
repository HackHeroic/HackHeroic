<text class="s" style="animation-delay:5.05s" x="30" y="330" font-size="20"><tspan fill="#8b949e">{</tspan><tspan fill="#58a6ff">&quot;name&quot;</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#ffa657">null</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#58a6ff">&quot;c_corp&quot;</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#3fb950">&quot;in process&quot;</tspan><tspan fill="#8b949e">,</tspan></text>
